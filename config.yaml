# Agent Configuration
agent:
  name: "Assistant"
  model: "ollama-cloud:deepseek-v4-flash"
  system_prompt: |
    You are a helpful assistant.

    CRITICAL RULES:
    - NEVER guess or estimate - always use tools to get exact numbers/facts
    - If you don't know, say "Let me check" and call the appropriate tool
    - Tell user EXACTLY what the tool returns, never your estimate
    - When the user asks about their own information (name, preferences, history, facts about themselves), ALWAYS call memory_search first before answering. Do not rely on conversation context alone.
    - For counting questions ("How many...", "How much total...", "total", list all items): use memory_count FIRST — it does deterministic counting server-side. Trust the count it returns.
    - For questions about information that might span multiple workspaces, use memory_search_all_workspaces.

# Subagent Configuration
subagent:
  # Default model for subagents (uses main agent model if not specified)
  # model: "ollama-cloud:minimax-m2.5"

# Memory / Checkpointing
memory:
  # Checkpointer: LangGraph SQLite (DISABLED - resource intensive in production)
  # Set CHECKPOINT_ENABLED=true to enable conversational state persistence
  checkpointer:
    enabled: false
    retention_days: 0 # 0=disabled, -1=forever, N=days

  # Long-term message storage (SQLite + FTS5 + ChromaDB)
  messages:
    enabled: true

  # Memory consolidation
  # consolidate_after_messages: N messages before triggering consolidation (0=disabled)
  consolidate_after_messages: 10

  # Summarization: SDK-native SummarizationMiddleware (short-term token reduction)
  # trigger_tokens: summarize when total exceeds this (~8000 tokens = ~16K chars)
  # keep_tokens: always preserve this many tokens of recent context (~2000 tokens)
  summarization:
    enabled: true
    trigger_tokens: 8000
    keep_tokens: 2000

# Observability
observability:
  logging:
    enabled: true
    level: "info" # debug, info, warning, error
    json_dir: "data/logs"
  langfuse:
    enabled: true
    host: "https://cloud.langfuse.com"
    environment: "development" # production, development, staging

# API Server
api:
  host: "0.0.0.0"
  port: 8000

# Tools
tools:
  max_retries: 3
  timeout: 30

# Skills
skills:
  enabled: true

# Filesystem
filesystem:
  enabled: true
  # workspace_root: ~/executive-assistant  # Default: user's home. Override for custom path

# Shell
shell_tool:
  enabled: true
  allowed_commands:
    - python3
    - node
    - echo
    - date
    - whoami
    - pwd
  timeout_seconds: 30
  max_output_kb: 100

# Email Sync
email_sync:
  enabled: true
  interval_minutes: 5 # How often to poll for new emails
  batch_size: 50 # Emails per batch (lower to avoid rate limits)
  backfill_limit: 100 # Max emails to backfill initially (lower to avoid rate limits)
  max_retries: 3 # Max retries on rate limit error
  retry_delay: 30 # Seconds to wait before retry
  cooldown_minutes: 15 # Minutes to wait after rate limit detected

# MCP (Model Context Protocol)
mcp:
  enabled: true
  idle_timeout_minutes: 30 # Kill MCP servers after this long of inactivity
