deployment:
  session_lease_timeout_seconds: 300
agent:
  # No pinned model ships in the repo (D0-5): each deployment supplies its
  # own via PROFILE.md, per-user settings, or AGENT_MODEL / this file. Empty
  # = fail-fast at first use with guidance. Example: anthropic:claude-... or
  # deepseek-v4.1-flash:cloud is the current research pin (2026-09-27; 0731 was retired).
  model: ''
  name: Jen
  # Raised from 25. The property-research procedure needs: composing a persona,
  # writing plan.md, six subagent_create calls, each subagent reading its brief
  # (files_read pages at 100 lines, so a 90-line brief costs 1-2 iterations),
  # reading evidence back, and compiling the report. The first real acceptance
  # run spent all 25 iterations re-reading a 260-line doctrine that was ALREADY
  # its system prompt, created zero subagents, and produced no dossier.
  # 100 is the schema's hard ceiling (AppConfig validation), so this is as
  # high as it goes. The POC's profile used max_llm_calls: 120 for the same reason.
  max_iterations: 100  # schema ceiling is 100 (settings.py validation); cannot go higher
  system_prompt: "You are a helpful assistant.\n\nCRITICAL RULES:\n- NEVER guess or\
    \ estimate - always use tools to get exact numbers/facts\n- If you don't know,\
    \ say \"Let me check\" and call the appropriate tool\n- Tell user EXACTLY what\
    \ the tool returns, never your estimate\n- When the user asks about their own\
    \ information (name, preferences, history, facts about themselves), ALWAYS call\
    \ message_search first before answering. Do not rely on conversation context alone.\n\
    - For counting questions (\"How many...\", \"How much total...\", \"total\", list\
    \ all items): use message_count FIRST \u2014 it does deterministic counting server-side.\
    \ Trust the count it returns.\n- For questions about information that might span\
    \ multiple workspaces, use message_search across sessions.\n"
api:
  host: 0.0.0.0
  # Local dev binds 8080 = the native-app (Zig) client contract. Docker
  # deployments override with API_PORT=8000 env (env beats yaml for api.*).
  port: 8080
email_sync:
  backfill_limit: 100
  batch_size: 50
  cooldown_minutes: 15
  enabled: true
  interval_minutes: 5
  max_retries: 3
  retry_delay: 30
filesystem:
  enabled: true
mcp:
  enabled: true
  idle_timeout_minutes: 30
  # Axis A — when to defer (measured):
  #   auto      equivalent to auto:10
  #   auto:N    defer when deferrable definitions reach N% of the context window
  # Axis B — which tools may be direct (explicit override):
  #   always  every surviving tool is directly callable
  #   search  tools are indexed and findable via tool_search, not callable
  #   never   only the governed mcp_proxy tool reaches the model
  # v0.6.21 values direct|hybrid|proxy are accepted one release and deprecated.
  #
  # `auto` measures the durable metadata cache, never a live connection, so it
  # starts no MCP server where `always` starts one per configured server. A
  # cold cache defers rather than injecting an uncosted catalogue.
  exposure: auto
  # Global globs; exclude is applied after include, so a name in both is
  # excluded. `*` and `?` are supported.
  include_tools: []
  exclude_tools: []
  # Tools exempt from deferral. Server-supplied meta.alwaysLoad is ignored
  # unless trust_server_exemptions is enabled for that server.
  always_load: []
  trust_server_exemptions: false
  defer_with_missing_metadata: true
  cache_ttl_seconds: 86400
  refresh_timeout_seconds: 5.0
  max_result_chars: 20000
memory:
  checkpointer:
    enabled: false
    retention_days: 0
  consolidate_after_messages: 10
  messages:
    enabled: true
  summarization:
    enabled: true
    keep:
    - messages
    - 20
    model: ''
    prompt_file: summarisation_prompt.md
    trigger:
    - tokens
    - 8000
    trim_tokens_to_summarize: 4000
observability:
  langfuse:
    # Host is per-deployment env (LANGFUSE_HOST), never hard-coded here.
    # CONSENT: tracing is OFF by default. This file is baked into the Docker
    # image, so `enabled: true` here was force-enabling tracing in every
    # deployed container regardless of LANGFUSE_ENABLED — the acceptance
    # gate only held while keys/hosts were absent. Opt in per deployment:
    # LANGFUSE_ENABLED=1 (env beats yaml) or enabled: true here.
    enabled: false
    environment: development
  logging:
    enabled: true
    json_dir: data/logs
    level: info
sandbox:
  # Explicit deployment-only variables available to sandboxed commands.
  # Never add provider/API secrets unless a custom tool requires them.
  env_allow: []
scheduling:
  # Unattended subagent schedules (#46). Off by default: a scheduled run cannot
  # pause for approval, so only plans whose every capability resolves to `allow`
  # can be scheduled, and the surface stays dark until you opt in.
  #   SCHEDULING_SUBAGENT_ENABLED=1
  subagent_enabled: false
shell_tool:
  # shell_execute is approval-required when governance is enabled.
  # Add interpreters or other broad capabilities only as explicit deployment opt-ins.
  allowed_commands:
  - echo
  - date
  - whoami
  - pwd
  - agent-browser
  # firecrawl: the property-research agent's only web access. The pack's
  # fetch-rules block (in every brief) tells each subagent to reach the web with
  # `shell_execute` running this CLI, so without it in the allowlist every
  # research subagent's first call is refused. Requires firecrawl-cli installed
  # in the image (docker/Dockerfile) and FIRECRAWL_API_KEY in docker/.env.
  - firecrawl
  enabled: true
  max_output_kb: 100
  # Raised from 30s: a firecrawl scrape of a property portal routinely runs
  # 40-90s, and at 30s the command is killed mid-fetch — which looks exactly
  # like a blocked or empty source to the agent.
  timeout_seconds: 180
  # Per-file write budget for sandboxed commands (RLIMIT_FSIZE, MB).
  # Left commented on purpose: a value here would override
  # SHELL_TOOL_MAX_WRITE_MB. Default 64. See issue #32 part 3.
  # max_write_mb: 64
governance:
  # `_tool_decision` calls resolve_permission() for every tool a subagent is
  # created with, and requires "allow" — and it does so whether or not
  # `enabled` is true (subagent_capabilities.py:295-300). `_default_permission`
  # hard-codes shell_execute -> "ask" (governance.py:233-236), so without this
  # entry a correctly-created research subagent is REFUSED at preflight with
  # "tool: shell_execute (permission_ask)" and the run silently degrades to no
  # fetching at all.
  permissions:
    tools:
      shell_execute: allow
skills:
  enabled: true
subagent: null
tools:
  # Shipped native tools only. Custom per-tool TOOL.md and MCP tools remain available.
  native:
    mode: all  # all | selected | none
    enabled: []  # exact/glob names when mode is selected
  # Coarse family-level disable, applied to every tool family. Narrows only:
  # it can never re-admit a capability-disabled or governance-denied tool.
  disabled: []  # globs, e.g. ["mcp__github*"]
  max_retries: 3
  timeout: 30
verification:
  # mode defaults to "off" (rubric never runs unless requested) — decision
  # 2026-08-29: fresh deployments ship with verification off; admins opt in
  # via mode: auto|on per deployment.
  enabled: false
  grader_model: ''
  default_rubric: '- Response is non-empty'
