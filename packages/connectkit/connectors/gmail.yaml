name: gmail
display: Google Gmail
icon: gmail
category: email
version: '1.0'
description: Connect your Google account to sync and search Gmail (Sign in with Google).
auth:
  type: oauth2
  oauth2:
    authorize_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    scopes:
    - https://www.googleapis.com/auth/gmail.readonly
    extra_params:
      access_type: offline
      prompt: consent
    pkce: true
    token_env_var: GMAIL_ACCESS_TOKEN
  required_fields:
  - name: client_id
    label: Google OAuth Client ID
    placeholder: 1234567890-xxxx.apps.googleusercontent.com
    input_type: text
    help_text: Create an OAuth 2.0 Client ID in Google Cloud Console (executive-assistant-auth project).
    optional: false
  - name: client_secret
    label: Google OAuth Client Secret
    placeholder: GOCSPX-...
    input_type: password
    help_text: The client secret for the OAuth 2.0 Client ID.
    optional: false
setup_guide_url: https://developers.google.com/gmail/api/auth/about-auth
# No tool_source: email tools are SDK-native (GmailClient + HybridDB), not
# ConnectKit-discovered. This spec only drives the OAuth flow + catalog entry.
