<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script type="importmap">
{
  "imports": {
    "prosemirror-model": "https://esm.sh/prosemirror-model@1.24.0",
    "prosemirror-state": "https://esm.sh/prosemirror-state@1.4.3",
    "prosemirror-view": "https://esm.sh/prosemirror-view@1.37.0",
    "prosemirror-schema-list": "https://esm.sh/prosemirror-schema-list@1.5.0",
    "prosemirror-commands": "https://esm.sh/prosemirror-commands@1.6.0",
    "prosemirror-keymap": "https://esm.sh/prosemirror-keymap@1.2.2",
    "prosemirror-inputrules": "https://esm.sh/prosemirror-inputrules@1.4.0",
    "prosemirror-history": "https://esm.sh/prosemirror-history@1.4.1"
  }
}
</script>
<style>
:root {
  --ea-bg: #08090A;
  --ea-surface: #0E0F12;
  --ea-border: #1E1F24;
  --ea-text: #cdd6f4;
  --ea-text-secondary: #6c7086;
  --ea-accent: #239766;
  --ea-accent-hover: #28a873;
  --ea-danger: #e64553;
  --ea-font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--ea-bg);
  color: var(--ea-text);
  font-family: var(--ea-font);
  font-size: 14px;
  line-height: 1.6;
  overflow: hidden;
}
.editor-wrapper {
  display: flex;
  flex-direction: column;
  height: 100vh;
}
.editor-content {
  flex: 1;
  overflow-y: auto;
  padding: 0;
}
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 16px;
  border-top: 1px solid var(--ea-border);
  font-size: 12px;
  color: var(--ea-text-secondary);
  background: var(--ea-surface);
}
.status-bar button {
  background: var(--ea-accent);
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 6px 16px;
  cursor: pointer;
  font-size: 12px;
  font-family: var(--ea-font);
}
.status-bar button:hover { background: var(--ea-accent-hover); }
.status-bar button.cancel { background: #45475a; }
.status-bar button.cancel:hover { background: #585b70; }
.ProseMirror {
  min-height: 100%;
  padding: 24px 32px;
  outline: none;
  word-wrap: break-word;
  white-space: pre-wrap;
  white-space: break-spaces;
  line-height: 1.6;
}
.ProseMirror p { margin: 0.5em 0; }
.ProseMirror h1 { font-size: 1.75em; margin: 0.7em 0 0.3em; font-weight: 600; }
.ProseMirror h2 { font-size: 1.45em; margin: 0.6em 0 0.25em; font-weight: 600; }
.ProseMirror h3 { font-size: 1.25em; margin: 0.5em 0 0.2em; font-weight: 600; }
.ProseMirror h4 { font-size: 1.1em; margin: 0.4em 0 0.2em; font-weight: 600; }
.ProseMirror h5 { font-size: 1em; margin: 0.4em 0 0.2em; font-weight: 600; }
.ProseMirror h6 { font-size: 0.9em; margin: 0.4em 0 0.2em; font-weight: 600; }
.ProseMirror blockquote {
  border-left: 3px solid var(--ea-accent);
  padding-left: 16px;
  margin: 0.5em 0;
  color: var(--ea-text-secondary);
}
.ProseMirror hr {
  border: none;
  border-top: 1px solid var(--ea-border);
  margin: 1em 0;
}
.ProseMirror ul, .ProseMirror ol { padding-left: 24px; margin: 0.5em 0; }
.ProseMirror li { margin: 0.2em 0; }
.ProseMirror ::selection { background: rgba(35, 151, 102, 0.3); }
.ProseMirror-gapcursor {
  display: none;
  pointer-events: none;
  position: relative;
}
.ProseMirror-gapcursor:after {
  content: "";
  display: block;
  position: absolute;
  top: -2px;
  width: 20px;
  border-top: 1px solid var(--ea-text);
  animation: ProseMirror-cursor-blink 1.1s steps(2, start) infinite;
}
@keyframes ProseMirror-cursor-blink { to { visibility: hidden; } }
.ProseMirror-focused .ProseMirror-gapcursor { display: block; }
.suggestion-underline {
  border-bottom: 3px solid var(--ea-accent);
  background: rgba(35, 151, 102, 0.08);
  cursor: pointer;
}
.suggestion-actions {
  display: inline-flex;
  gap: 2px;
  margin-left: 2px;
  vertical-align: middle;
  position: relative;
  z-index: 10;
}
.suggestion-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  font-size: 11px;
  line-height: 1;
  padding: 0;
  transition: transform 0.1s;
}
.suggestion-btn:hover { transform: scale(1.15); }
.suggestion-btn.accept { background: var(--ea-accent); color: #fff; }
.suggestion-btn.reject { background: var(--ea-danger); color: #fff; }
</style>
</head>
<body>
<div class="editor-wrapper">
  <div id="novel-mount" class="editor-content"></div>
  <div class="status-bar">
    <span id="chars">0 chars</span>
    <span>
      <button class="cancel" onclick="window.__cancel()">Cancel</button>
      <button onclick="window.__save()">Save</button>
    </span>
  </div>
</div>
<script type="module">
import {Schema, DOMParser, DOMSerializer} from "prosemirror-model";
import {EditorState, Plugin, PluginKey} from "prosemirror-state";
import {EditorView, Decoration, DecorationSet} from "prosemirror-view";
import {
  baseKeymap, chainCommands, exitCode,
  toggleMark, setBlockType, wrapIn, splitBlock
} from "prosemirror-commands";
import {keymap} from "prosemirror-keymap";
import {undo, redo, history} from "prosemirror-history";
import {
  wrappingInputRule, textblockTypeInputRule, inputRules
} from "prosemirror-inputrules";
import {
  wrapInList, splitListItem, liftListItem, sinkListItem
} from "prosemirror-schema-list";

const schema = new Schema({
  nodes: {
    doc: {content: "block+"},
    paragraph: {
      content: "inline*",
      group: "block",
      parseDOM: [{tag: "p"}],
      toDOM: () => ["p", 0]
    },
    text: {group: "inline"},
    hard_break: {
      inline: true,
      group: "inline",
      parseDOM: [{tag: "br"}],
      toDOM: () => ["br"]
    },
    heading: {
      content: "inline*",
      group: "block",
      defining: true,
      attrs: {level: {default: 1}},
      parseDOM: [1,2,3,4,5,6].map(n => ({tag: `h${n}`, attrs: {level: n}})),
      toDOM: node => [`h${node.attrs.level}`, 0]
    },
    blockquote: {
      content: "block+",
      group: "block",
      parseDOM: [{tag: "blockquote"}],
      toDOM: () => ["blockquote", 0]
    },
    horizontal_rule: {
      group: "block",
      parseDOM: [{tag: "hr"}],
      toDOM: () => ["hr"]
    },
    ordered_list: {
      content: "list_item+",
      group: "block",
      attrs: {order: {default: 1}},
      parseDOM: [{
        tag: "ol",
        getAttrs: dom => ({order: +(dom.getAttribute("start") || 1)})
      }],
      toDOM: node => [
        "ol",
        {start: node.attrs.order === 1 ? null : node.attrs.order},
        0
      ]
    },
    bullet_list: {
      content: "list_item+",
      group: "block",
      parseDOM: [{tag: "ul"}],
      toDOM: () => ["ul", 0]
    },
    list_item: {
      content: "block+",
      parseDOM: [{tag: "li"}],
      toDOM: () => ["li", 0]
    }
  }
});

const suggestionPluginKey = new PluginKey("suggestions");

class SuggestionPluginState {
  constructor(items = []) {
    this.items = items;
  }

  buildDecos(doc) {
    if (this.items.length === 0) return DecorationSet.empty;
    const decos = [];
    for (const s of this.items) {
      const from = Math.max(1, Math.min(s.from, doc.content.size));
      const to = Math.max(from, Math.min(s.to, doc.content.size));
      decos.push(
        Decoration.inline(from, to, {class: "suggestion-underline"})
      );
      decos.push(
        Decoration.widget(to, () => {
          const wrap = document.createElement("span");
          wrap.className = "suggestion-actions";
          const a = document.createElement("button");
          a.className = "suggestion-btn accept";
          a.textContent = "Accept";
          a.onclick = () => acceptSuggestion(s.id);
          const r = document.createElement("button");
          r.className = "suggestion-btn reject";
          r.textContent = "Reject";
          r.onclick = () => rejectSuggestion(s.id);
          wrap.appendChild(a);
          wrap.appendChild(r);
          return wrap;
        }, {key: `sug-${s.id}`})
      );
    }
    return DecorationSet.create(doc, decos);
  }
}

const suggestionPlugin = new Plugin({
  key: suggestionPluginKey,
  state: {
    init() { return new SuggestionPluginState(); },
    apply(tr, prev) {
      const meta = tr.getMeta(suggestionPluginKey);
      if (meta && meta.type === "add") {
        return new SuggestionPluginState([
          ...prev.items,
          {
            id: meta.id,
            from: meta.from,
            to: meta.to,
            suggestedText: meta.suggestedText,
            filePath: meta.filePath
          }
        ]);
      }
      if (meta && meta.type === "remove") {
        return new SuggestionPluginState(
          prev.items
            .filter(s => s.id !== meta.id)
            .map(s => ({
              ...s,
              from: tr.mapping.map(s.from),
              to: tr.mapping.map(s.to)
            }))
        );
      }
      return new SuggestionPluginState(
        prev.items
          .map(s => ({
            ...s,
            from: tr.mapping.map(s.from),
            to: tr.mapping.map(s.to)
          }))
          .filter(s => s.from >= 0 && s.to >= 0)
      );
    }
  },
  props: {
    decorations(state) {
      const ps = suggestionPluginKey.getState(state);
      return ps ? ps.buildDecos(state.doc) : DecorationSet.empty;
    }
  }
});

const __INITIAL_HTML__ = %%INITIAL_HTML%%;
const __FILE_PATH__ = %%FILE_PATH%%;

let view = null;

function initEditor() {
  const mount = document.getElementById("novel-mount");
  if (!mount) return;

  const initialHtml = __INITIAL_HTML__ || "";

  let doc;
  if (initialHtml.trim()) {
    const html = initialHtml.trim().startsWith("<")
      ? initialHtml
      : "<p>" + initialHtml.replace(/\n/g, "<br>") + "</p>";
    const dom = new DOMParser().parseFromString(
      "<div>" + html + "</div>",
      "text/html"
    ).body.firstChild;
    if (dom) {
      const parsed = DOMParser.fromSchema(schema).parse(dom);
      if (parsed && parsed.content.size > 0) {
        doc = parsed;
      } else {
        doc = schema.node("doc", null, [schema.node("paragraph")]);
      }
    } else {
      doc = schema.node("doc", null, [schema.node("paragraph")]);
    }
  } else {
    doc = schema.node("doc", null, [schema.node("paragraph")]);
  }

  const state = EditorState.create({
    doc,
    plugins: [
      inputRules({rules: [
        textblockTypeInputRule(/^(#{1,6})\s$/, schema.nodes.heading, m => ({
          level: m[1].length
        })),
        wrappingInputRule(/^\s*>\s$/, schema.nodes.blockquote),
        wrappingInputRule(/^\s*[-*+]\s$/, schema.nodes.bullet_list),
        wrappingInputRule(/^(\d+)\.\s$/, schema.nodes.ordered_list, m => ({
          order: +m[1]
        }))
      ]}),
      keymap(baseKeymap),
      keymap({
        "Mod-z": undo,
        "Mod-y": redo,
        "Shift-Mod-z": redo,
        Enter: chainCommands(
          exitCode,
          (cmdState, cmdDispatch) => {
            if (
              cmdState.selection.$from.parent.type === schema.nodes.list_item
            ) {
              return splitListItem(schema.nodes.list_item)(
                cmdState, cmdDispatch
              );
            }
            return false;
          },
          splitBlock
        ),
        Tab: (cmdState, cmdDispatch) =>
          sinkListItem(schema.nodes.list_item)(cmdState, cmdDispatch),
        "Shift-Tab": (cmdState, cmdDispatch) =>
          liftListItem(schema.nodes.list_item)(cmdState, cmdDispatch)
      }),
      history(),
      suggestionPlugin
    ]
  });

  view = new EditorView(mount, {
    state,
    dispatchTransaction(tr) {
      const newState = view.state.apply(tr);
      view.updateState(newState);
      updateCharCount();
    }
  });

  updateCharCount();
}

function updateCharCount() {
  if (!view) return;
  const el = document.getElementById("chars");
  if (el) {
    el.textContent = `${view.state.doc.textContent.length} chars`;
  }
}

function addSuggestion({id, filePath, suggestedText, from, to}) {
  if (!view) return;
  const state = view.state;
  const doc = state.doc;
  const contentSize = doc.content.size;
  let f = from === -1 || from == null ? 1 : from;
  let t = to === -1 || to == null ? contentSize : to;
  f = Math.max(1, Math.min(f, contentSize));
  t = Math.max(f, Math.min(t, contentSize));
  try {
    doc.resolve(f);
    doc.resolve(t);
  } catch {
    return;
  }
  const tr = state.tr.setMeta(suggestionPluginKey, {
    type: "add", id, from: f, to: t, suggestedText, filePath
  });
  view.dispatch(tr);
}

function acceptSuggestion(id) {
  if (!view) return;
  const state = view.state;
  const ps = suggestionPluginKey.getState(state);
  const sug = ps.items.find(s => s.id === id);
  if (!sug) return;
  let tr = state.tr;
  tr = tr.replaceWith(
    sug.from, sug.to, state.schema.text(sug.suggestedText)
  );
  tr = tr.setMeta(suggestionPluginKey, {type: "remove", id});
  view.dispatch(tr);
  window.parent.postMessage({
    type: "editor_action",
    action: "suggestion_accept",
    suggestion_id: id,
    file_path: __FILE_PATH__
  }, "*");
}

function rejectSuggestion(id) {
  if (!view) return;
  const state = view.state;
  const ps = suggestionPluginKey.getState(state);
  const sug = ps.items.find(s => s.id === id);
  if (!sug) return;
  const tr = state.tr.setMeta(suggestionPluginKey, {type: "remove", id});
  view.dispatch(tr);
  window.parent.postMessage({
    type: "editor_action",
    action: "suggestion_reject",
    suggestion_id: id,
    file_path: __FILE_PATH__
  }, "*");
}

window.__save = function() {
  if (!view) return;
  const serializer = DOMSerializer.fromSchema(schema);
  const fragment = serializer.serializeFragment(view.state.doc.content);
  const div = document.createElement("div");
  div.appendChild(fragment);
  window.parent.postMessage({
    type: "editor_action",
    action: "save",
    content: div.innerHTML
  }, "*");
};

window.__cancel = function() {
  window.parent.postMessage({
    type: "editor_action",
    action: "cancel"
  }, "*");
};

window.__addSuggestion = addSuggestion;

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initEditor);
} else {
  initEditor();
}
</script>
</body>
</html>
