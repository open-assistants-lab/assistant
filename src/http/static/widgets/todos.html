<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="stylesheet" href="/static/ea-tokens.css">
  <style>
    * { box-sizing: border-box; }
    .pane { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .pane-hdr { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--border-default); flex-shrink: 0; }
    .pane-hdr h2 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; color: var(--text-primary); display: flex; align-items: center; gap: 6px; }
    .pane-hdr .badge { font-size: 11px; color: var(--text-tertiary); font-weight: 500; }

    .list { flex: 1; overflow-y: auto; }
    .todo { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--border-subtle); transition: background 120ms; }
    .todo:hover { background: var(--bg-elevated); }
    .todo-cb { position: relative; width: 18px; height: 18px; flex-shrink: 0; }
    .todo-cb input { position: absolute; opacity: 0; cursor: pointer; width: 100%; height: 100%; margin: 0; z-index: 1; }
    .todo-cb .check { position: absolute; inset: 0; border: 2px solid var(--border-default); border-radius: 4px; transition: all 150ms; }
    .todo-cb input:checked + .check { background: var(--accent); border-color: var(--accent); }
    .todo-cb input:checked + .check::after { content: ''; position: absolute; left: 4px; top: 1px; width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
    .todo-cb input:focus-visible + .check { outline: 2px solid var(--accent); outline-offset: 2px; }
    .todo-text { flex: 1; color: var(--text-primary); font-size: 13.5px; transition: all 180ms; }
    .todo-text.done { text-decoration: line-through; color: var(--text-tertiary); }
    .todo-del { background: none; border: none; color: var(--text-tertiary); cursor: pointer; font-size: 16px; padding: 2px 4px; border-radius: var(--radius-sm); opacity: 0; transition: all 120ms; line-height: 1; }
    .todo:hover .todo-del { opacity: 1; }
    .todo-del:hover { color: var(--error); background: rgba(229,91,91,0.1); }

    .bar { display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--border-subtle); background: var(--bg-surface); flex-shrink: 0; }
    .bar input { flex: 1; background: var(--bg-field); border: 1px solid var(--border-default); border-radius: var(--radius-sm); padding: 7px 10px; color: var(--text-primary); font-size: 13.5px; outline: none; transition: border-color 150ms; }
    .bar input:focus { border-color: var(--accent); }
    .bar input::placeholder { color: var(--text-tertiary); }
    .bar button { background: var(--accent); border: none; border-radius: var(--radius-sm); color: #fff; cursor: pointer; font-size: 18px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; transition: background 120ms; flex-shrink: 0; }
    .bar button:hover { background: var(--accent-hover); }
    .bar button:active { transform: scale(0.95); }

    .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 56px 24px; color: var(--text-tertiary); flex: 1; }
    .empty .mat { font-size: 36px; margin-bottom: 12px; opacity: 0.4; }
    .empty .msg { font-size: 13.5px; font-weight: 500; }
    .empty .sub { font-size: 12px; margin-top: 4px; opacity: 0.65; }

    .fi { animation: fi 280ms both; }
    @keyframes fi { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="pane">
    <div class="pane-hdr"><h2><span class="mat material-symbols-outlined" style="font-size:18px;color:var(--text-tertiary)">checklist</span>To-Do</h2><span class="badge" id="count"></span></div>
    <div class="list" id="list"></div>
    <div class="bar"><input type="text" id="input" placeholder="Add a task..." autocomplete="off"><button onclick="add()">+</button></div>
  </div>
  <script>
    let todos = [];
    async function fetch() { try { const r = await fetch('/todos'); const d = await r.json(); todos = d.todos || []; } catch { todos = []; } render(); }
    async function toggle(id, checked) { const s = checked ? 'done' : 'active'; try { await fetch('/todos/' + encodeURIComponent(id) + '?status=' + s, {method:'PUT'}); } catch {} await fetch(); }
    async function del(id) { try { await fetch('/todos/' + encodeURIComponent(id), {method:'DELETE'}); } catch {} await fetch(); }
    async function add() { const inp = document.getElementById('input'); const t = inp.value.trim(); if (!t) return; try { await fetch('/todos?content=' + encodeURIComponent(t), {method:'POST'}); } catch {} inp.value = ''; inp.focus(); await fetch(); }
    document.getElementById('input').addEventListener('keydown', function(e) { if (e.key === 'Enter') add(); });
    function render() {
      const el = document.getElementById('list'); const done = todos.filter(t => t.done).length;
      document.getElementById('count').textContent = todos.length + ' item' + (todos.length !== 1 ? 's' : '') + (done ? ' (' + done + ' done)' : '');
      if (!todos.length) { el.innerHTML = '<div class="empty"><span class="mat material-symbols-outlined">checklist</span><div class="msg">No tasks yet</div><div class="sub">Add a task above to get started</div></div>'; return; }
      el.innerHTML = todos.map((t, i) =>
        '<div class="todo fi" style="animation-delay:' + (i * 12) + 'ms">' +
          '<label class="todo-cb"><input type="checkbox" ' + (t.done ? 'checked' : '') + ' onchange="toggle(\'' + esc(t.id) + '\', this.checked)"><span class="check"></span></label>' +
          '<span class="todo-text ' + (t.done ? 'done' : '') + '">' + esc(t.title || t.text || '') + '</span>' +
          '<button class="todo-del material-symbols-outlined" onclick="del(\'' + esc(t.id) + '\')">close</button></div>'
      ).join('');
    }
    function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    fetch();
  </script>
</body>
</html>
