<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/ea-tokens.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <style>
    * { box-sizing: border-box; }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px; border-bottom: 1px solid var(--border-default); }
    .header h2 { margin: 0; font-size: 15px; font-weight: 600; color: var(--text-primary); }
    .header .count { font-size: 12px; color: var(--text-tertiary); font-weight: 400; }
    .todo-list { overflow-y: auto; }
    .todo-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--border-subtle); transition: background var(--transition-fast); }
    .todo-item:hover { background: var(--bg-elevated); }
    .todo-checkbox { position: relative; width: 20px; height: 20px; flex-shrink: 0; }
    .todo-checkbox input { position: absolute; opacity: 0; cursor: pointer; width: 100%; height: 100%; margin: 0; }
    .todo-checkbox .checkmark { position: absolute; inset: 0; border: 2px solid var(--border-default); border-radius: 4px; transition: all var(--transition-fast); pointer-events: none; }
    .todo-checkbox input:checked + .checkmark { background: var(--accent); border-color: var(--accent); }
    .todo-checkbox input:checked + .checkmark::after { content: ''; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
    .todo-checkbox input:focus-visible + .checkmark { outline: 2px solid var(--accent); outline-offset: 2px; }
    .todo-text { flex: 1; color: var(--text-primary); font-size: 14px; transition: all var(--transition-base); }
    .todo-text.done { text-decoration: line-through; color: var(--text-tertiary); }
    .todo-delete { background: none; border: none; color: var(--text-tertiary); cursor: pointer; padding: 4px; border-radius: var(--radius-sm); font-size: 18px; opacity: 0; transition: all var(--transition-fast); }
    .todo-item:hover .todo-delete { opacity: 1; }
    .todo-delete:hover { color: var(--error); background: rgba(229, 91, 91, 0.1); }
    .add-bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border-subtle); background: var(--bg-surface); }
    .add-bar input { flex: 1; background: var(--bg-field); border: 1px solid var(--border-default); border-radius: var(--radius-sm); padding: 8px 10px; color: var(--text-primary); font-size: 14px; outline: none; transition: border-color var(--transition-fast); }
    .add-bar input:focus { border-color: var(--accent); }
    .add-bar input::placeholder { color: var(--text-tertiary); }
    .add-bar button { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; background: var(--accent); border: none; border-radius: var(--radius-sm); color: #fff; cursor: pointer; font-size: 20px; transition: background var(--transition-fast); }
    .add-bar button:hover { background: var(--accent-hover); }
    .add-bar button:active { transform: scale(0.95); }
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 24px; color: var(--text-tertiary); }
    .empty-state .icon { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }
    .empty-state .sub { font-size: 12px; margin-top: 4px; opacity: 0.7; }

    .fade-in { animation: fadeIn var(--transition-moment); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="header">
    <h2>To-Do</h2>
    <span class="count" id="todo-count"></span>
  </div>
  <div class="todo-list" id="todo-list"></div>
  <div class="add-bar">
    <input type="text" id="new-todo-input" placeholder="Add a task..." autocomplete="off">
    <button onclick="addTodo()" title="Add task">+</button>
  </div>

  <script>
    let todos = [];

    async function fetchTodos() {
      try {
        const res = await fetch('/todos');
        const data = await res.json();
        todos = data.todos || [];
      } catch { todos = []; }
      renderTodos();
    }

    async function toggleTodo(id, checked) {
      const status = checked ? 'done' : 'active';
      try { await fetch('/todos/' + encodeURIComponent(id) + '?status=' + status, { method: 'PUT' }); } catch {}
      await fetchTodos();
    }

    async function deleteTodo(id) {
      try { await fetch('/todos/' + encodeURIComponent(id), { method: 'DELETE' }); } catch {}
      await fetchTodos();
    }

    async function addTodo() {
      const inp = document.getElementById('new-todo-input');
      const text = inp.value.trim();
      if (!text) return;
      try { await fetch('/todos?content=' + encodeURIComponent(text), { method: 'POST' }); } catch {}
      inp.value = '';
      inp.focus();
      await fetchTodos();
    }

    document.getElementById('new-todo-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') addTodo();
    });

    function renderTodos() {
      const list = document.getElementById('todo-list');
      document.getElementById('todo-count').textContent = todos.length + ' item' + (todos.length !== 1 ? 's' : '');
      const done = todos.filter(t => t.done).length;
      if (done > 0) document.getElementById('todo-count').textContent += ' (' + done + ' done)';

      if (todos.length === 0) {
        list.innerHTML = '<div class="empty-state fade-in"><div class="icon">📋</div><div class="text">No tasks yet</div><div class="sub">Add a task above to get started</div></div>';
        return;
      }

      list.innerHTML = todos.map((t, i) => `
        <div class="todo-item fade-in" style="animation-delay:${i * 15}ms">
          <label class="todo-checkbox">
            <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTodo('${esc(t.id)}', this.checked)">
            <span class="checkmark"></span>
          </label>
          <span class="todo-text ${t.done ? 'done' : ''}">${esc(t.title || t.text || '')}</span>
          <button class="todo-delete material-symbols-outlined" onclick="deleteTodo('${esc(t.id)}')">close</button>
        </div>
      `).join('');
    }

    function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    fetchTodos();
  </script>
</body>
</html>
