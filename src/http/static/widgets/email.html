<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/ea-tokens.css">
  <style>
    * { box-sizing: border-box; }
    .pane { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .pane-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--border-default); flex-shrink: 0; }
    .pane-header h2 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; color: var(--text-primary); }
    .pane-header .badge { font-size: 11px; color: var(--text-tertiary); font-weight: 500; }
    .pane-header .unread-pill { font-size: 11px; font-weight: 600; background: var(--accent); color: #fff; padding: 1px 7px; border-radius: 99px; margin-left: 8px; }

    .scroll-list { flex: 1; overflow-y: auto; }
    .thread { padding: 11px 14px; border-bottom: 1px solid var(--border-subtle); cursor: pointer; transition: background 120ms; }
    .thread:hover { background: var(--bg-elevated); }
    .thread-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1px; gap: 8px; }
    .thread-from { font-size: 13.5px; color: var(--text-primary); font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .thread-date { font-size: 12px; color: var(--text-tertiary); flex-shrink: 0; }
    .thread-subj { font-size: 13px; color: var(--text-secondary); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .thread-snip { font-size: 12px; color: var(--text-tertiary); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .thread.unread { border-left: 2px solid var(--accent); padding-left: 12px; }
    .thread.unread .thread-from { font-weight: 600; }
    .thread.unread .thread-subj { color: var(--text-primary); font-weight: 500; }

    .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 56px 24px; color: var(--text-tertiary); flex: 1; }
    .empty .ico { font-size: 32px; margin-bottom: 12px; opacity: 0.4; }
    .empty .msg { font-size: 13.5px; font-weight: 500; }
    .empty .sub { font-size: 12px; margin-top: 4px; opacity: 0.65; }

    .detail { display: none; flex-direction: column; height: 100vh; }
    .detail-top { display: flex; align-items: center; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--border-default); flex-shrink: 0; }
    .back { display: inline-flex; align-items: center; gap: 4px; background: none; border: none; color: var(--accent); cursor: pointer; font-size: 13px; padding: 4px 8px; border-radius: var(--radius-sm); transition: background 120ms; }
    .back:hover { background: var(--accent-muted); }
    .detail-subj { padding: 14px 14px 0; font-size: 15px; font-weight: 600; color: var(--text-primary); flex-shrink: 0; }
    .detail-meta { padding: 8px 14px 12px; border-bottom: 1px solid var(--border-subtle); flex-shrink: 0; }
    .detail-meta .r { display: flex; gap: 6px; font-size: 13px; margin-bottom: 2px; }
    .detail-meta .l { color: var(--text-tertiary); min-width: 42px; }
    .detail-meta .v { color: var(--text-secondary); }
    .detail-body { flex: 1; padding: 14px; font-size: 13.5px; line-height: 1.6; color: var(--text-primary); white-space: pre-wrap; word-break: break-word; overflow-y: auto; }

    .fi { animation: fi 280ms both; }
    @keyframes fi { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="pane" id="inbox">
    <div class="pane-header">
      <h2>Inbox</h2>
      <span class="badge" id="count"></span>
    </div>
    <div class="scroll-list" id="list"></div>
  </div>
  <div class="detail" id="detail">
    <div class="detail-top"><button class="back" onclick="showInbox()">← Back</button></div>
    <div class="detail-subj" id="d-subj"></div>
    <div class="detail-meta">
      <div class="r"><span class="l">From</span><span class="v" id="d-from"></span></div>
      <div class="r"><span class="l">Date</span><span class="v" id="d-date"></span></div>
    </div>
    <div class="detail-body" id="d-body"></div>
  </div>
  <script>
    let msgs = [];
    async function fetch() {
      try { const r = await fetch('/emails?limit=50'); const d = await r.json(); msgs = d.emails || []; } catch { msgs = []; }
      render();
    }
    function render() {
      const el = document.getElementById('list');
      const unread = msgs.filter(e => !e.is_read).length;
      document.getElementById('count').innerHTML = msgs.length + ' total' + (unread ? ' <span class="unread-pill">' + unread + '</span>' : '');
      if (!msgs.length) { el.innerHTML = '<div class="empty"><div class="ico">📬</div><div class="msg">No emails</div><div class="sub">Connect Gmail in Settings to get started</div></div>'; return; }
      el.innerHTML = msgs.map((e, i) =>
        '<div class="thread ' + (!e.is_read ? 'unread' : '') + ' fi" style="animation-delay:' + (i * 12) + 'ms" onclick="open(\'' + esc(e.id) + '\')">' +
          '<div class="thread-row"><span class="thread-from">' + esc(e.from || '') + '</span><span class="thread-date">' + fmtDate(e.date || e.received_at || '') + '</span></div>' +
          '<div class="thread-subj">' + esc(e.subject || '(no subject)') + '</div>' +
          '<div class="thread-snip">' + esc((e.snippet || '').slice(0, 100)) + '</div>' +
        '</div>'
      ).join('');
    }
    function fmtDate(d) {
      if (!d) return '';
      const dt = new Date(d);
      if (isNaN(dt)) return d;
      const n = new Date();
      if (n - dt < 86400000) return dt.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
      if (n - dt < 604800000) return dt.toLocaleDateString([], {weekday:'short'});
      return dt.toLocaleDateString([], {month:'short',day:'numeric'});
    }
    async function open(id) {
      try {
        const r = await fetch('/emails/' + encodeURIComponent(id));
        const e = await r.json();
        if (e.error) { showInbox(); return; }
        document.getElementById('inbox').style.display = 'none';
        document.getElementById('detail').style.display = 'flex';
        document.getElementById('d-subj').textContent = e.subject || '(no subject)';
        document.getElementById('d-from').textContent = e.from || '';
        document.getElementById('d-date').textContent = e.date || e.received_at || '';
        document.getElementById('d-body').textContent = e.body || e.snippet || '';
      } catch { showInbox(); }
    }
    function showInbox() { document.getElementById('detail').style.display = 'none'; document.getElementById('inbox').style.display = 'flex'; fetch(); }
    function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    fetch();
  </script>
</body>
</html>
