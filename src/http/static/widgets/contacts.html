<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/ea-tokens.css">
  <style>
    * { box-sizing: border-box; }
    .pane { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .pane-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--border-default); flex-shrink: 0; }
    .pane-header h2 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; color: var(--text-primary); }
    .pane-header .badge { font-size: 11px; color: var(--text-tertiary); font-weight: 500; }

    .scroll-list { flex: 1; overflow-y: auto; }
    .contact { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--border-subtle); cursor: pointer; transition: background 120ms; }
    .contact:hover { background: var(--bg-elevated); }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-muted); display: flex; align-items: center; justify-content: center; color: var(--accent); font-weight: 600; font-size: 14px; flex-shrink: 0; }
    .contact-info { flex: 1; min-width: 0; }
    .contact-name { color: var(--text-primary); font-size: 13.5px; font-weight: 500; }
    .contact-email { color: var(--text-secondary); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .contact-arrow { color: var(--text-tertiary); font-size: 14px; flex-shrink: 0; opacity: 0; transition: opacity 120ms; }
    .contact:hover .contact-arrow { opacity: 1; }

    .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 56px 24px; color: var(--text-tertiary); flex: 1; }
    .empty .ico { font-size: 32px; margin-bottom: 12px; opacity: 0.4; }
    .empty .msg { font-size: 13.5px; font-weight: 500; }
    .empty .sub { font-size: 12px; margin-top: 4px; opacity: 0.65; }

    .detail { display: none; flex-direction: column; height: 100vh; }
    .detail-top { display: flex; align-items: center; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--border-default); flex-shrink: 0; }
    .back { display: inline-flex; align-items: center; gap: 4px; background: none; border: none; color: var(--accent); cursor: pointer; font-size: 13px; padding: 4px 8px; border-radius: var(--radius-sm); transition: background 120ms; }
    .back:hover { background: var(--accent-muted); }
    .detail-av { display: flex; justify-content: center; padding: 20px 12px 12px; flex-shrink: 0; }
    .detail-av .av { width: 48px; height: 48px; border-radius: 50%; background: var(--accent-muted); display: flex; align-items: center; justify-content: center; color: var(--accent); font-weight: 600; font-size: 20px; }
    .detail-fields { padding: 0 14px 12px; }
    .detail-f { padding: 10px 0; border-bottom: 1px solid var(--border-subtle); }
    .detail-f:last-child { border-bottom: none; }
    .detail-f .l { font-size: 11px; font-weight: 500; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 2px; }
    .detail-f .v { font-size: 14px; color: var(--text-primary); }

    .fi { animation: fi 280ms both; }
    @keyframes fi { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="pane" id="list-view">
    <div class="pane-header"><h2>Contacts</h2><span class="badge" id="count"></span></div>
    <div class="scroll-list" id="list"></div>
  </div>
  <div class="detail" id="detail-view">
    <div class="detail-top"><button class="back" onclick="showList()">← Back</button></div>
    <div class="detail-av"><div class="av" id="d-av"></div></div>
    <div class="detail-fields">
      <div class="detail-f"><div class="l">Name</div><div class="v" id="d-n"></div></div>
      <div class="detail-f"><div class="l">Email</div><div class="v" id="d-e"></div></div>
      <div class="detail-f"><div class="l">Phone</div><div class="v" id="d-p"></div></div>
      <div class="detail-f"><div class="l">Company</div><div class="v" id="d-c"></div></div>
    </div>
  </div>
  <script>
    let contacts = [];
    async function fetch() { try { const r = await fetch('/contacts'); const d = await r.json(); contacts = d.contacts || []; } catch { contacts = []; } render(); }
    function render() {
      const el = document.getElementById('list');
      document.getElementById('count').textContent = contacts.length + ' contact' + (contacts.length !== 1 ? 's' : '');
      if (!contacts.length) { el.innerHTML = '<div class="empty"><div class="ico">👤</div><div class="msg">No contacts</div><div class="sub">Add contacts through the agent or import from email</div></div>'; return; }
      el.innerHTML = contacts.map((c, i) =>
        '<div class="contact fi" style="animation-delay:' + (i * 12) + 'ms" onclick="open(\'' + esc(c.id || c.email) + '\')">' +
          '<div class="avatar">' + (c.name || c.email || '?')[0].toUpperCase() + '</div>' +
          '<div class="contact-info"><div class="contact-name">' + esc(c.name || '(no name)') + '</div><div class="contact-email">' + esc(c.email || '') + '</div></div>' +
          '<span class="contact-arrow">›</span>' +
        '</div>'
      ).join('');
    }
    async function open(id) {
      try {
        const r = await fetch('/contacts/' + encodeURIComponent(id)); const d = await r.json(); const c = d.contact || d;
        if (c.error) { showList(); return; }
        document.getElementById('list-view').style.display = 'none'; document.getElementById('detail-view').style.display = 'flex';
        document.getElementById('d-av').textContent = (c.name || c.email || '?')[0].toUpperCase();
        document.getElementById('d-n').textContent = c.name || '-'; document.getElementById('d-e').textContent = c.email || '-';
        document.getElementById('d-p').textContent = c.phone || '-'; document.getElementById('d-c').textContent = c.company || '-';
      } catch { showList(); }
    }
    function showList() { document.getElementById('detail-view').style.display = 'none'; document.getElementById('list-view').style.display = 'flex'; }
    function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    fetch();
  </script>
</body>
</html>
