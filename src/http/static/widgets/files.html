<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/ea-tokens.css">
  <style>
    .files { padding: 8px; }
    .file-item { padding: 8px; border-bottom: 1px solid var(--border-subtle); cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .file-item:hover { background: var(--bg-elevated); }
    .file-icon { color: var(--text-tertiary); flex-shrink: 0; }
    .file-name { color: var(--text-primary); flex: 1; }
    .file-size { color: var(--text-tertiary); font-size: 12px; }
    .file-content { padding: 12px; }
    .file-content pre { background: var(--bg-field); padding: 12px; border-radius: var(--radius-md); overflow-x: auto; font-size: 13px; margin: 0; }
    .back-btn { color: var(--accent); cursor: pointer; margin-bottom: 8px; display: inline-block; }
    .header { padding:12px 8px; font-weight:600; color:var(--text-primary); border-bottom:1px solid var(--border-default); }
    .current-path { padding:4px 8px; color: var(--text-secondary); font-size: 12px; border-bottom: 1px solid var(--border-subtle); }
  </style>
</head>
<body>
  <div id="list-view">
    <div class="header">Files</div>
    <div class="current-path" id="current-path">/</div>
    <div class="files" id="file-list"></div>
  </div>
  <div id="content-view" class="file-content" style="display:none;"></div>
  <script>
    async function fetchFiles(path) {
      const url = path ? '/files/list?path=' + encodeURIComponent(path) : '/files/list';
      try {
        const res = await fetch(url);
        const data = await res.json();
        const files = data.files || data || [];
        document.getElementById('current-path').textContent = path || '/';
        renderFiles(files);
      } catch {}
    }
    function renderFiles(files) {
      const list = document.getElementById('file-list');
      if (files.length === 0) {
        list.innerHTML = '<div style="padding:16px;text-align:center;color:var(--text-tertiary);">No files</div>';
        return;
      }
      list.innerHTML = files.map(f => `
        <div class="file-item" onclick="${f.is_dir ? 'fetchFiles(\'' + escPath(f.path) + '\')' : 'showFile(\'' + escPath(f.path) + '\')'}">
          <span class="file-icon">${f.is_dir ? '📁' : '📄'}</span>
          <span class="file-name">${esc(f.name)}</span>
          <span class="file-size">${f.size || ''}</span>
        </div>
      `).join('');
    }
    async function showFile(path) {
      try {
        const res = await fetch('/files/read?path=' + encodeURIComponent(path));
        const data = await res.text();
        document.getElementById('list-view').style.display = 'none';
        document.getElementById('content-view').style.display = 'block';
        document.getElementById('content-view').innerHTML = `
          <span class="back-btn" onclick="showList()">← Back to files</span>
          <div style="margin-bottom:8px; font-weight:500;">${esc(path)}</div>
          <pre>${esc(data)}</pre>
        `;
      } catch {}
    }
    function showList() {
      document.getElementById('list-view').style.display = 'block';
      document.getElementById('content-view').style.display = 'none';
    }
    function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function escPath(s) { return (s || '').replace(/'/g, "\\'"); }
    fetchFiles('');
  </script>
</body>
</html>
