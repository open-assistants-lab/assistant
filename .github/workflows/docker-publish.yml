name: docker-publish

# Build and publish the assistant container image to GHCR.
# ghcr.io/open-assistants-lab/assistant — public repo => free unlimited pulls.
#
# NOTE on build duration: the image bundles the memory-vector extra
# (sentence-transformers -> torch), so the arm64 leg builds under QEMU
# emulation and can take 30-60+ minutes. The amd64 leg is native and fast.

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: open-assistants-lab/assistant

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # v0.3.0 -> 0.3.0 (plus v0.3.0 and 0.3 forms)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # latest on the default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # short commit sha (sha-<short>)
            type=sha,format=short

      # Build context = repo root, dockerfile = docker/Dockerfile — mirrors
      # docker-compose.yaml's `context: .., dockerfile: docker/Dockerfile`.
      # EXTRAS build-arg is intentionally NOT overridden: the Dockerfile
      # default (--extra memory-vector --extra analytics) ships the full image.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true