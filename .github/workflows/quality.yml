name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --all-extras
      - name: Ruff — zero-tolerance (docs/quality/quality-gate-policy.md)
        run: uv run ruff check src/ tests/ scripts/
      - name: mypy — checked-in ratchet
        run: uv run python scripts/mypy_baseline.py
