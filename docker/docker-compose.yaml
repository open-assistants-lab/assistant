services:
  # Assistant HTTP API
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: assistant
    ports:
      # Loopback only — bot runs on this host; never expose.
      # 8099, not 8080: the `research-stack` compose project already binds
      # 127.0.0.1:8080 for searxng, so the 8080 mapping below could never bind
      # and the container had to be started on 8099 by hand. Recording that here
      # makes `docker compose up -d --build` reproduce the running container
      # instead of failing on a taken port. (The property-research app and the
      # POC's docs both assumed 8080 — that assumption was wrong.)
      - "127.0.0.1:8099:8080"
    command: ["uv", "run", "assistant", "http"]
    env_file:
      - path: .env
        required: false
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8080"
      DEPLOYMENT_DATA_ROOT: /app/data
      DEPLOYMENT_DATA_PATH: /app/data
    volumes:
      - ./data:/app/data
      # Admin-editable settings: edit ./config.yaml + `docker compose restart app`
      # (no rebuild). Remove this mount to bake config into the image instead.
      - ../config.yaml:/app/config.yaml
    restart: unless-stopped
    healthcheck:
      # python:3.13-slim has no curl — use urllib
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
