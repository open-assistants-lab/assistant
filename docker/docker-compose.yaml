services:
  # Assistant HTTP API
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: assistant
    ports:
      - "8080:8080"
    command: ["uv", "run", "assistant-sdk", "http"]
    environment:
      # Auth — set API_KEY to require auth on non-localhost connections
      API_KEY: ${API_KEY:-}
      # SOLO_BYPASS defaults to true: localhost requests skip auth

      # LLM provider keys — the engine is multi-provider (registry-driven).
      # Set the key(s) for whichever provider your model uses, and set the
      # default model via config.yaml (agent.model, e.g. "openai:gpt-5.2",
      # "anthropic:claude-sond...") or per-request `model` + `provider_keys`.
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      AGNES_API_KEY: ${AGNES_API_KEY:-}
      # Admin knobs — grader (rubric verification), summarisation, title model
      VERIFICATION_ENABLED: ${VERIFICATION_ENABLED:-}
      VERIFICATION_GRADER_MODEL: ${VERIFICATION_GRADER_MODEL:-}
      VERIFICATION_DEFAULT_RUBRIC: ${VERIFICATION_DEFAULT_RUBRIC:-}
      VERIFICATION_MAX_ITERATIONS: ${VERIFICATION_MAX_ITERATIONS:-}
      SUMMARY_ENABLED: ${SUMMARY_ENABLED:-}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-}
      AGENT_TITLE_MODEL: ${AGENT_TITLE_MODEL:-}

      # Firecrawl for web search/scraping (self-hosted or cloud)
      # Self-hosted: set FIRECRAWL_BASE_URL (no key needed)
      # Cloud: set FIRECRAWL_API_KEY (get from firecrawl.dev)
      FIRECRAWL_BASE_URL: ${FIRECRAWL_BASE_URL:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}

      # Storage — both must point into the mounted volume, otherwise user
      # data lands in /root/Assistant inside the container and is lost on
      # recreation. DEPLOYMENT_DATA_ROOT holds user data (conversation, files,
      # memory, email); DEPLOYMENT_DATA_PATH holds project data (logs, cache).
      DEPLOYMENT_DATA_ROOT: /app/data
      DEPLOYMENT_DATA_PATH: /app/data

      # Server (API_* envs, see src/config/settings.py) — canonical port 8080
      API_HOST: "0.0.0.0"
      API_PORT: "8080"

      # Logging
      LOGGING_LEVEL: ${LOGGING_LEVEL:-info}
    volumes:
      - ./data:/app/data
      # Admin-editable settings: edit ./config.yaml + `docker compose restart app`
      # (no rebuild). Remove this mount to bake config into the image instead.
      - ../config.yaml:/app/config.yaml
    restart: unless-stopped
    healthcheck:
      # python:3.13-slim has no curl — use urllib
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
