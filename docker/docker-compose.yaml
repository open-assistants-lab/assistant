services:
  # Assistant HTTP API
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: assistant
    ports:
      - "8080:8080"
    command: ["uv", "run", "assistant-sdk", "http"]
    env_file:
      - path: .env
        required: false
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8080"
      DEPLOYMENT_DATA_ROOT: /app/data
      DEPLOYMENT_DATA_PATH: /app/data
    volumes:
      - ./data:/app/data
      # Admin-editable settings: edit ./config.yaml + `docker compose restart app`
      # (no rebuild). Remove this mount to bake config into the image instead.
      - ../config.yaml:/app/config.yaml
    restart: unless-stopped
    healthcheck:
      # python:3.13-slim has no curl — use urllib
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
